version: 1
criteria:
  - id: adr-traceability
    description: Every accepted ADR has ≥1 linked assertion or rubric criterion
    weight: 2
    judge: manifest-sync   # deterministic: scores 0 or 1
  - id: cockpit-clarity
    description: Dashboard surfaces trend, ADR status, and judge/deterministic ratio without extra clicks
    weight: 1
    judge: llm
  - id: loop-closure
    description: Disagreements between judge and human resolve into an ADR amendment or promoted assertion within one iteration
    weight: 3
    judge: llm
adrs:
  0001-teddy-bootstrap:
    criteria: [adr-traceability]
  0002-cockpit-minimal-scope:
    criteria: [cockpit-clarity]
  0003-github-native-approval:
    criteria: [adr-traceability]
  0004-lint-gate:
    criteria: []
