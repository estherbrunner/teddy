<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Teddy — Cockpit</title>
  <link rel="icon" href="data:," />
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --edge: #262b36;
      --text: #e6e8ee;
      --muted: #9aa3b2;
      --accent: #6ea8fe;
      --green: #4ade80;
      --amber: #fbbf24;
      --dim: #566072;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 980px; margin: 0 auto; padding: 32px 20px 64px; }
    header h1 { margin: 0; font-size: 22px; letter-spacing: 0.2px; }
    header .sub { color: var(--muted); margin-top: 2px; font-size: 13px; }
    .bigrow {
      display: flex; align-items: baseline; gap: 16px;
      margin: 18px 0 6px; flex-wrap: wrap;
    }
    .big { font-size: 44px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .delta { font-size: 14px; font-variant-numeric: tabular-nums; }
    .delta.up { color: var(--green); }
    .delta.down { color: var(--amber); }
    .delta.flat { color: var(--muted); }
    section {
      background: var(--panel); border: 1px solid var(--edge);
      border-radius: 10px; padding: 16px 18px; margin-top: 16px;
    }
    section h2 { margin: 0 0 2px; font-size: 13px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); }
    section .hint { color: var(--dim); font-size: 12px; margin-bottom: 10px; }
    .multiples { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
    .mini { border: 1px solid var(--edge); border-radius: 8px; padding: 10px 12px; }
    .mini .t { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .mini .id { font-weight: 600; font-size: 13px; }
    .mini .val { font-variant-numeric: tabular-nums; color: var(--accent); font-size: 13px; }
    .mini .meta { color: var(--dim); font-size: 11px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px;
      padding: 6px 8px; border-bottom: 1px solid var(--edge); }
    td { padding: 7px 8px; border-bottom: 1px solid var(--edge); vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    td a { color: var(--accent); text-decoration: none; }
    td a:hover { text-decoration: underline; }
    .chip { display: inline-block; padding: 1px 8px; border-radius: 999px;
      font-size: 11.5px; border: 1px solid var(--edge); color: var(--muted); }
    .chip.accepted { color: var(--green); border-color: var(--green); }
    .chip.pending { color: var(--amber); border-color: var(--amber); }
    .chip.dead { color: var(--dim); text-decoration: line-through; }
    .jrow { display: grid; grid-template-columns: minmax(120px, 220px) 1fr auto;
      gap: 10px; align-items: center; padding: 4px 0; font-size: 13px;
      font-variant-numeric: tabular-nums; }
    .bar { height: 10px; border-radius: 5px; background: var(--edge); overflow: hidden; }
    .bar > div { height: 100%; background: var(--accent); }
    .jrow .lbl { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    footer { color: var(--dim); font-size: 12px; margin-top: 18px; }
    .empty { color: var(--muted); font-style: italic; }
  </style>
</head>
<body>
  <main id="app"></main>
  <!-- data.js is generated by `npm run report`; main.js by `npm run build`. -->
  <script src="data.js"></script>
  <script src="main.js"></script>
</body>
</html>
