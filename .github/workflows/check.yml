name: check
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm ci
      # Deterministic hard gate: selftest (the checks themselves), traceability,
      # scores/baseline gate, data.js freshness — then typecheck and build.
      - run: npm test
      - run: npm run build
