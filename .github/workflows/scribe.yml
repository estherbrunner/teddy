name: scribe
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  scribe:
    # Closes the iteration on the branch once the gates are green; the merge
    # carries the derived state into main — no post-merge push, no ruleset
    # bypass (adr/0003, as amended).
    if: startsWith(github.event.pull_request.head.ref, 'iteration/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm ci
      - run: node checks/scribe.ts
        env:
          GITHUB_EVENT_NAME: pull_request
      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "scribe: nothing to record"
            exit 0
          fi
          git config user.name "teddy-scribe[bot]"
          git config user.email "teddy-scribe[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "scribe: close ${{ github.event.pull_request.head.ref }}"
          git push origin ${{ github.event.pull_request.head.ref }}
